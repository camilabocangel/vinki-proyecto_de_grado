name: CI

on:
  push:
    branches: [master, '001-*']
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vinki
          POSTGRES_PASSWORD: vinki_dev
          POSTGRES_DB: vinki
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx tsc --noEmit
      - run: cd backend && npx jest --no-cache --ci --coverage
        env:
          DATABASE_URL: postgresql://vinki:vinki_dev@localhost:5432/vinki?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_PRIVATE_KEY: test-key
          JWT_PUBLIC_KEY: test-key
          LLM_SANDBOX: 'true'

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: cd frontend/app && npm ci
      - run: cd frontend/app && npx tsc --noEmit
      - run: cd frontend/app && npx vitest run --coverage

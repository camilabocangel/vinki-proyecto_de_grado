name: E2E (Playwright)

on:
  pull_request:
    branches: [master]
  # Permite disparar el workflow manualmente cuando se quieran ejecutar
  # los E2E completos fuera del flujo de PR.
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright — suites E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vinki
          POSTGRES_PASSWORD: vinki_dev
          POSTGRES_DB: vinki
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Backend
      DATABASE_URL: postgresql://vinki:vinki_dev@localhost:5432/vinki?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY: test-key
      JWT_PUBLIC_KEY: test-key
      LLM_SANDBOX: 'true'
      NODE_ENV: development
      PORT: '3000'
      FRONTEND_URL: http://localhost:5400
      # Frontend (apunta al backend levantado en este mismo job)
      VITE_API_URL: http://localhost:3000/api
      # Playwright
      PLAYWRIGHT_BASE_URL: http://localhost:5400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # NT-001: dependencias raíz (Playwright pineado en package.json).
      - name: Instalar dependencias raíz
        run: npm ci

      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Instalar dependencias frontend
        working-directory: frontend/app
        run: npm ci

      - name: Generar Prisma Client
        working-directory: backend
        run: node_modules/.bin/prisma generate

      - name: Aplicar migraciones Prisma
        working-directory: backend
        run: node_modules/.bin/prisma migrate deploy

      - name: Sembrar datos deterministas
        working-directory: backend
        run: node_modules/.bin/prisma db seed

      # NT-001: Playwright pineado a la versión de package.json raíz.
      # `--with-deps` instala las dependencias del sistema operativo
      # necesarias para Chromium en Ubuntu.
      - name: Instalar navegador Chromium para Playwright
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Levantar backend en background
        working-directory: backend
        run: |
          node_modules/.bin/nest start &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
          npx wait-on http://localhost:3000/api/health -t 60000

      - name: Ejecutar smoke E2E primero
        run: npm run e2e:smoke

      - name: Ejecutar suite E2E completa
        run: npm run e2e

      - name: Detener backend
        if: always()
        run: kill ${{ env.BACKEND_PID }} || true

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Subir videos y trazas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

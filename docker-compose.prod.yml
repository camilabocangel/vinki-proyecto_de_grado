# =============================================================================
# docker-compose.prod.yml — PLANTILLA (Decisión QA #4 — RNF-06)
# =============================================================================
# Este archivo es una PLANTILLA y NO está listo para un despliegue real.
#
# Propósito: documentar la topología de producción que satisface el RNF-06
# (cifrado de la comunicación en tránsito mediante TLS/HTTPS). En el entorno
# académico el sistema se ejecuta sobre HTTP (docker-compose.yml); la
# verificación de HTTPS se realiza a nivel de esta configuración.
#
# ANTES DEL DESPLIEGUE REAL DEBE COMPLETARSE:
#   1. Sustituir <DOMINIO> por el dominio real del despliegue.
#   2. Provisionar certificados TLS válidos (p. ej. Let's Encrypt / Certbot)
#      y montarlos en el volumen del reverse proxy.
#   3. Definir todos los secretos vía variables de entorno o un gestor de
#      secretos (NO incluir credenciales en este archivo).
#   4. Revisar límites de recursos, políticas de reinicio y backups.
#
# Limitación reconocida: por tratarse de un proyecto de grado académico sin
# operación productiva, esta plantilla no se ejecuta ni se valida en runtime;
# se entrega como evidencia de diseño para el cumplimiento de RNF-06.
# =============================================================================

services:
  # Reverse proxy con terminación TLS — punto único de entrada HTTPS.
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '443:443'
      - '80:80' # solo para redirección 80 -> 443
    volumes:
      # COMPLETAR: configuración de nginx con server block TLS y redirección.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # COMPLETAR: certificados TLS reales (no incluidos en el repositorio).
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000' # no se publica al host; solo accesible vía reverse-proxy
    environment:
      NODE_ENV: production
      # COMPLETAR: todos los valores vía variables de entorno / gestor de secretos.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FRONTEND_URL: https://<DOMINIO>
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '5173'
    environment:
      # La API se consume a través del reverse proxy bajo HTTPS.
      VITE_API_URL: https://<DOMINIO>/api
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
